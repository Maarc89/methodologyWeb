name: CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: methodology
          POSTGRES_USER: methodology
          POSTGRES_PASSWORD: methodology
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U methodology -d methodology"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          SECRET_KEY: ci-secret-key
          ALLOWED_HOSTS: localhost
          DJANGO_ENV: development
          DB_NAME: methodology
          DB_USER: methodology
          DB_PASSWORD: methodology
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
        run: python backend/manage.py test api.tests -v 2
