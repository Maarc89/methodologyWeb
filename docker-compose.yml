services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: django_app
    command: gunicorn methodologyWeb.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ../:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    container_name: vite_app
    volumes:
      - ../:/app
    working_dir: /app/frontend
    command: sh -c "npm install && npm run build && npm run preview"
    ports:
      - "5173:5173"

  db:
    image: postgres:15
    container_name: postgres_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: methodology
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
