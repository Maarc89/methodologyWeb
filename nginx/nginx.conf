events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Habilitar compresión básica
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    server {
        listen 443 ssl;
        server_name 172.16.4.40;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        charset utf-8;

        root /usr/share/nginx/html;
        index index.html;

        # Cabeceras de seguridad básicas
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        # Ajustar CSP a las necesidades de la app (placeholder conservador)
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https: http:; frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Endurecimiento TLS (ajustar según versión de Nginx)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

        # React build
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Django API
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Static files
        location /static/ {
            alias /static/;
        }

        # Proxy hacia Keycloak
        location /auth/ {
          proxy_pass https://172.16.5.11:8443/auth/;
          proxy_ssl_verify off;

          # Encabezados correctos para Keycloak
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Host $host;

          # Desactiva redirecciones internas automáticas
          proxy_redirect off;

          # Asegura compatibilidad con cookies cross-domain
          proxy_cookie_path / /;

          # Evita que Nginx quite encabezados importantes
          proxy_set_header Connection "";
      }

    }

    # Redirección HTTP → HTTPS
    server {
        listen 80;
        server_name 172.16.4.40;
        return 301 https://$host$request_uri;
    }
}
